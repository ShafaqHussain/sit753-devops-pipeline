[pytest]
testpaths = tests
addopts =
    -q
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --junitxml=reports/junit.xml
    # Quality gate: a non-zero exit here fails the pipeline's Test stage.
    # Set below the current 92% so ordinary refactoring does not trip it,
    # but high enough that a real drop in test discipline does.
    --cov-fail-under=85
filterwarnings =
    ignore::DeprecationWarning
