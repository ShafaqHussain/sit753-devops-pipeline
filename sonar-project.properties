# SonarCloud configuration for the Code Quality stage.
#
# Replace sonar.organization below with your SonarCloud organisation key, which
# you will see after signing in at sonarcloud.io with your GitHub account and
# importing this repository. The project key is usually <org>_<repo>.

sonar.projectKey=ShafaqHussain_sit753-devops-pipeline
sonar.organization=shafaqhussain
sonar.projectName=SIT753 Encrypted Chat DevOps Pipeline
sonar.host.url=https://sonarcloud.io

# Analyse the application source only. Tests are declared separately below so
# Sonar reports on them as tests rather than counting them as production code.
sonar.sources=backend,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/htmlcov/**,**/dist/**,**/tests/**

sonar.python.version=3.11

# Coverage produced by the Test stage. Handing this over means Sonar reports
# measured coverage rather than treating the project as untested.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/reports/junit.xml

sonar.sourceEncoding=UTF-8
