groups:
  - name: encrypted-chat-availability
    rules:
      - alert: ApplicationDown
        expr: up{job="encrypted-chat"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Encrypted chat application is unreachable"
          description: "Prometheus has failed to scrape the application for over 1 minute."

      - alert: HighServerErrorRate
        expr: |
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            /
          sum(rate(flask_http_request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "5xx error rate above 5 percent"
          description: "More than 5 percent of HTTP responses were server errors over the last 5 minutes."

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency above 1 second"
          description: "Requests are taking longer than 1 second at p95 over the last 5 minutes."
