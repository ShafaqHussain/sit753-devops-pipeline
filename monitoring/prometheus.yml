global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The application. "encrypted-chat-staging" is the container name the
  # pipeline's Deploy stage uses, and docker-compose gives its app service the
  # same network alias, so one config works both for a pipeline deployment and
  # for running the stack by hand.
  - job_name: encrypted-chat
    metrics_path: /metrics
    static_configs:
      - targets:
          - encrypted-chat-staging:5000
        labels:
          application: encrypted-chat
          environment: staging

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
