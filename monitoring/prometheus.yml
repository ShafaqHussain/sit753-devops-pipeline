global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: encrypted-chat
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:5000
        labels:
          application: encrypted-chat
          environment: staging

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
