apiVersion: 1

# Provisioned so Grafana comes up already pointed at Prometheus. Without this,
# the Monitoring stage would deliver a Grafana that still needs a human to
# click through datasource setup, which is exactly the manual step the rubric
# asks the pipeline to remove.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://chat-prometheus:9090
    isDefault: true
    editable: false
